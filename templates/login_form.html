{% extends "base_generic.html" %}
{% block head_content %}<title>Acceso — NuestroEntorno</title>{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - var(--nav-height) - 120px); display:flex; align-items:center; justify-content:center; padding: 3rem 1.5rem; background: var(--bg);">
  <div style="max-width:420px; width:100%;">

    <div style="margin-bottom:2rem;">
      <span class="section-label">Área restringida</span>
      <h1 style="font-size:1.625rem; font-weight:700; letter-spacing:-0.025em; margin-bottom:0.4rem;">
        Validación de reportes
      </h1>
      <p style="font-size:0.9rem; color:var(--text-secondary);">
        Introduce tu token personal para acceder al panel de moderación.
      </p>
    </div>

    {% if mensaje_error %}
      <div class="alert-error">
        <i class="fa-solid fa-circle-exclamation" style="margin-right:0.4rem;"></i>
        {{ mensaje_error }}
      </div>
    {% endif %}

    <div class="form-box">
      <form id="loginForm" method="post">
        <div class="form-group">
          <label class="form-label" for="token_personal">Token personal</label>
          <input
            class="form-input"
            type="text"
            id="token_personal"
            name="token_personal"
            placeholder="eyJhbGciOiJIUzI1NiIsInR5..."
            required
          >
        </div>
        <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
          <button type="submit" class="btn-solid" style="flex:1;">
            Acceder <i class="fa-solid fa-arrow-right" style="font-size:0.8rem;"></i>
          </button>
          <button type="button" class="btn-outline" onclick="cancelar()">Cancelar</button>
        </div>
      </form>
    </div>

  </div>
</div>

<script>
  function cancelar() {
    document.getElementById('token_personal').value = '';
  }
</script>
{% endblock %}
