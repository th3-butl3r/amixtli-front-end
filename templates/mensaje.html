{% extends "base_generic.html" %}

{% block content %}
<div class="msg-page">
  <div class="msg-card">
    <div class="msg-icon">
      <i class="fa-solid fa-check"></i>
    </div>
    <h2>Reporte actualizado</h2>
    <p>{{ mensaje }}</p>

      Continuar validando

  </div>
</div>
{% endblock %}
