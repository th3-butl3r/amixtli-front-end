name: CI — Tests y Seguridad

on:
  push:
    branches: ["master", "staging", "development"]
  pull_request:
    branches: ["master", "staging"]

jobs:
  # ── Lint y formato ────────────────────────────────────────────────────────
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pre-commit
        run: pip install pre-commit

      - name: Caché de hooks pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Ejecutar hooks
        run: pre-commit run --all-files

  # ── Tests ─────────────────────────────────────────────────────────────────
  tests:
    name: Tests con cobertura
    runs-on: ubuntu-latest
    needs: lint

    env:
      ENV_STATE: LOCAL
      LOCAL_AMIXTLI_API_REPORTS: ${{ secrets.LOCAL_AMIXTLI_API_REPORTS }}
      LOCAL_ALLOWED_EMAILS: ${{ secrets.LOCAL_ALLOWED_EMAILS }}
      LOCAL_SECRET_KEY: ${{ secrets.LOCAL_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: "latest"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependencias
        run: poetry install --no-interaction

      - name: Crear config/.env para tests
        run: |
          mkdir -p config
          cat > config/.env <<EOF
          ENV_STATE=LOCAL
          LOCAL_AMIXTLI_API_REPORTS=${{ secrets.LOCAL_AMIXTLI_API_REPORTS }}
          LOCAL_ALLOWED_EMAILS=${{ secrets.LOCAL_ALLOWED_EMAILS }}
          LOCAL_SECRET_KEY=${{ secrets.LOCAL_SECRET_KEY }}
          EOF

      - name: Ejecutar tests
        run: |
          poetry run pytest \
            --cov=app \
            --cov=services \
            --cov=managers \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ── Análisis de seguridad ─────────────────────────────────────────────────
  security:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de seguridad
        run: pip install bandit pip-audit

      # Bandit: análisis estático de vulnerabilidades en el código fuente
      - name: Bandit — análisis estático
        run: |
          bandit -r . \
            --exclude .venv,tests \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-report.json || true
          bandit -r . \
            --exclude .venv,tests \
            --severity-level medium \
            --confidence-level medium

      # pip-audit: dependencias con CVEs conocidas
      - name: pip-audit — dependencias
        run: pip-audit --requirement <(pip install poetry && poetry export -f requirements.txt --without-hashes 2>/dev/null) || true

      - name: Subir reporte Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  # ── Build Docker (verificación) ───────────────────────────────────────────
  docker-build:
    name: Verificar build Docker
    runs-on: ubuntu-latest
    needs: [tests, security]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t amixtli-web:ci .
