name: Análisis de seguridad

on:
  pull_request:
    branches: ["master", "staging", "development"]

# Mínimo necesario: solo leer el código para el checkout
permissions:
  contents: read

jobs:
  security:
    name: Bandit y pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar herramientas de seguridad
        run: pip install bandit pip-audit

      - name: Bandit — análisis estático
        run: |
          bandit -r . \
            --exclude .venv,tests \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-report.json || true
          bandit -r . \
            --exclude .venv,tests \
            --severity-level medium \
            --confidence-level medium

      - name: pip-audit — dependencias
        run: pip-audit --requirement <(pip install poetry && poetry export -f requirements.txt --without-hashes 2>/dev/null) || true

      - name: Subir reporte Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7
